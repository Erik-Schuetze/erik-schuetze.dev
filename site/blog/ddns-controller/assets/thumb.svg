<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="A cloud pointing down at a DNS record.">
  <title>A cloud pointing down at a DNS record</title>
  <rect width="128" height="128" rx="18" fill="#1b4bc6"/>

  <!-- the address out on the internet -->
  <g fill="#efdbbf">
    <circle cx="33" cy="49" r="13"/>
    <circle cx="95" cy="49" r="13"/>
    <circle cx="64" cy="37" r="21"/>
    <rect x="28" y="48" width="72" height="14" rx="7"/>
  </g>

  <!-- pointing at the record -->
  <line x1="64" y1="64" x2="64" y2="70" stroke="#efdbbf" stroke-width="8" stroke-linecap="round"/>
  <polygon points="64,84 54,70 74,70" fill="#efdbbf"/>

  <!-- the record itself -->
  <rect x="20" y="90" width="88" height="26" rx="9" fill="none" stroke="#efdbbf" stroke-width="6"/>
  <rect x="40" y="99" width="46" height="9" rx="4.5" fill="#efdbbf"/>
</svg>
