<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Overview of the bare-metal k3s cluster: ingress with MetalLB and ACME certificates in front of three N100 nodes and one GPU node, backed by Longhorn on local NVMe and a ZFS pool shared over NFS, all defined as manifests in Git.">
  <rect width="600" height="450" fill="#efdbbf"/>

  <text x="300" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0b162a">bare-metal k3s cluster</text>

  <!-- ingress -->
  <rect x="40" y="60" width="520" height="70" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="300" y="90" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">Ingress + TLS</text>
  <text x="300" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">MetalLB, ACME certificates</text>

  <line x1="300" y1="132" x2="300" y2="150" stroke="#1b4bc6" stroke-width="3"/>
  <polygon points="300,158 293,147 307,147" fill="#1b4bc6"/>

  <!-- compute -->
  <rect x="40" y="160" width="118" height="90" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="99" y="197" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">N100</text>
  <text x="99" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">k3s node</text>

  <rect x="172" y="160" width="118" height="90" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="231" y="197" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">N100</text>
  <text x="231" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">k3s node</text>

  <rect x="304" y="160" width="118" height="90" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="363" y="197" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">N100</text>
  <text x="363" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">k3s node</text>

  <rect x="436" y="160" width="124" height="90" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="498" y="197" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">Ryzen</text>
  <text x="498" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">GPU node</text>

  <line x1="300" y1="254" x2="300" y2="272" stroke="#1b4bc6" stroke-width="3"/>
  <polygon points="300,280 293,269 307,269" fill="#1b4bc6"/>

  <!-- storage -->
  <rect x="40" y="282" width="250" height="88" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="165" y="318" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">Longhorn</text>
  <text x="165" y="341" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">replicated on local NVMe</text>

  <rect x="310" y="282" width="250" height="88" rx="10" fill="#f1eae0" stroke="#1b4bc6" stroke-width="3"/>
  <text x="435" y="318" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0b162a">ZFS pool</text>
  <text x="435" y="341" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">shared over NFS</text>

  <text x="300" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#242a2b">GitOps: the whole cluster is manifests in Git</text>
</svg>
